<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#12365a">
  <title>ПромКинематика — сайт в разработке</title>
  <style>
    :root {
      --navy: #12365a;
      --navy-dark: #0b2239;
      --text: #17212b;
      --muted: #607080;
      --line: #dbe4ec;
      --bg: #f4f7fa;
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      font-family: Inter, "Segoe UI", Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 20% 15%, rgba(18, 54, 90, .10), transparent 34rem),
        linear-gradient(135deg, #ffffff, var(--bg));
    }

    main {
      min-height: 100%;
      display: grid;
      place-items: center;
      padding: 32px 20px;
    }

    .card {
      width: min(760px, 100%);
      padding: clamp(36px, 7vw, 72px);
      background: rgba(255, 255, 255, .88);
      border: 1px solid rgba(219, 228, 236, .9);
      border-radius: 28px;
      box-shadow: 0 24px 70px rgba(11, 34, 57, .12);
      backdrop-filter: blur(10px);
    }

    .brand {
      margin-bottom: 48px;
    }
    
    .brand-logo {
      display: block;
      width: 100%;
      max-width: 430px;
      height: auto;
    }
    
    h1 {
      margin: 0 0 20px;
      max-width: 650px;
      font-size: clamp(38px, 8vw, 72px);
      line-height: .98;
      letter-spacing: -.055em;
      color: var(--navy-dark);
    }

    p {
      margin: 0;
      max-width: 610px;
      font-size: clamp(18px, 2.5vw, 22px);
      line-height: 1.55;
      color: var(--muted);
    }

    .divider {
      width: 84px;
      height: 4px;
      margin: 36px 0;
      border-radius: 99px;
      background: var(--navy);
    }

    .services {
      font-size: 15px;
      line-height: 1.7;
      letter-spacing: .04em;
      text-transform: uppercase;
      color: var(--navy);
    }

    footer {
      margin-top: 52px;
      padding-top: 22px;
      border-top: 1px solid var(--line);
      font-size: 14px;
      color: #7a8996;
    }
  </style>
</head>
<body>
  <main>
    <section class="card" aria-labelledby="page-title">
        <div class="brand">
          <img
            class="brand-logo"
            src="logo-promkinematika.svg"
            alt="ПромКинематика"
          >
        </div>
      <h1 id="page-title">Сайт находится в разработке</h1>
      <p>
        Скоро здесь появится информация о решениях по роботизации
        и автоматизации промышленных производств.
      </p>

      <div class="divider"></div>

      <div class="services">
        Промышленные роботы · Проектирование · Интеграция
      </div>

      <footer>© 2026 ООО «ПромКинематика»</footer>
    </section>
  </main>
</body>
</html>
